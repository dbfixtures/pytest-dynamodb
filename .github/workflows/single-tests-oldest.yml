name: Run pytest tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Supported python versions'
        default: '["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]'
        required: false
        type: string
      os:
        description: 'Operating system to run tests on'
        default: 'ubuntu-latest'
        required: false
        type: string
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false

jobs:
  dynamodb:
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      OS: ${{ inputs.os }}
      PYTHON: ${{ matrix.python-version }}
      UV_NO_SYNC: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up DynamoDB Local
      uses: $/.github/actions/dynamodb-local
    - name: Set up uv with python ${{ matrix.python-version }}
      uses: fizyk/actions-reuse/.github/actions/uv-setup@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install oldest supported versions
      uses: fizyk/actions-reuse/.github/actions/uv-run@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        command: pip install -r oldest/requirements.txt
    - uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        pytest-opts: -c pyproject.oldest.toml -p no:xdist -k "not docker"
        data-file: .coverage.serial
        output-file: coverage-serial.xml
    - uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        pytest-opts: -c pyproject.oldest.toml -n auto --max-worker-restart=0 -k "not docker"
        coverage-config: .coveragerc
        data-file: .coverage.xdist
        output-file: coverage-xdist.xml
    - uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        pytest-opts: -c pyproject.oldest.toml -p no:xdist -k docker --dynamodb-host=localhost --dynamodb-port=8088
        data-file: .coverage.docker
        output-file: coverage-docker.xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: coverage-serial.xml,coverage-xdist.xml,coverage-docker.xml
        flags: linux
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
