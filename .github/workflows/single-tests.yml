name: Run pytest tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Supported python versions'
        default: '["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]'
        required: false
        type: string
      os:
        description: 'Operating system to run tests on'
        default: 'ubuntu-latest'
        required: false
        type: string
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false

jobs:
  dynamodb:
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      OS: ${{ inputs.os }}
      PYTHON: ${{ matrix.python-version }}
    # Service containers to run with `container-job`
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.0
        ports:
          - 8088:8000

    steps:
    - uses: actions/checkout@v6
    - name: Install DynamoDB
      run: |
        mkdir /tmp/dynamodb
        wget -O - https://d1ni2b6xgvw0s0.cloudfront.net/v3.x/dynamodb_local_latest.tar.gz | tar xz --directory /tmp/dynamodb
    - name: Set up uv with python ${{ matrix.python-version }}
      uses: fizyk/actions-reuse/.github/actions/uv-setup@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        pytest-opts: -p no:xdist -k "not docker"
        data-file: .coverage.serial
        output-file: coverage-serial.xml
    - uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        pytest-opts: -n auto --max-worker-restart=0 -k "not docker"
        coverage-config: .coveragerc
        data-file: .coverage.xdist
        output-file: coverage-xdist.xml
    - uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
      with:
        pytest-opts: -p no:xdist -k docker --dynamodb-host=localhost --dynamodb-port=8088
        data-file: .coverage.docker
        output-file: coverage-docker.xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6.0.0
      with:
        files: coverage-serial.xml,coverage-xdist.xml,coverage-docker.xml
        flags: linux
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
