[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "pytest-dynamodb"
version = "3.0.1"
description = "DynamoDB fixtures for pytest"
readme = "README.rst"
keywords = [ "aws", "boto", "dynamodb", "fixture", "pytest", "tests" ]
license = "LGPL-3.0-or-later"
license-files = [ "COPYING.lesser" ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "boto3>=1.42.0",
    "boto3-stubs[dynamodb]",
    "mirakuru>=2.6.0",
    "port-for>=0.7.3",
    "pytest>=8.4.0",
]

[[project.authors]]
name = "Grzegorz Śliwiński"
email = "fizyk+pypi@fizyk.dev"

[project.urls]
Source = "https://github.com/dbfixtures/pytest-dynamodb"
"Bug Tracker" = "https://github.com/dbfixtures/pytest-dynamodb/issues"
Changelog = "https://github.com/dbfixtures/pytest-dynamodb/blob/v3.0.1/CHANGES.rst"

[project.entry-points.pytest11]
pytest_dynamodb = "pytest_dynamodb.plugin"

[dependency-groups]
dev = [
    "boto3==1.43.83",
    "boto3-stubs[dynamodb]==1.43.83",
    "coverage==7.16.0",
    "mirakuru==3.0.2",
    "mypy==2.3.1; implementation_name=='cpython'",
    "port-for==1.0.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "towncrier==25.8.0",
]
release = [
    "tbump==6.11.0",
]

[tool.uv.build-backend]
module-name = "pytest_dynamodb"
module-root = ""
source-include = [ "CHANGES.rst" ]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "PT",  # flake8-pytest-style
    "TRY", # tryceratops
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.pytest]
norecursedirs = [ "tests/examples" ]
pytester_example_dir = "tests/examples"
testpaths = [ "tests" ]
xfail_strict = true

[tool.tbump]

[[tool.tbump.before_commit]]
name = "Build changelog"
cmd = "uv run towncrier build --version {new_version} --yes"

[[tool.tbump.field]]
name = "extra"
default = ""

[[tool.tbump.file]]
src = "pytest_dynamodb/__init__.py"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'Changelog = "https://github.com/dbfixtures/pytest-dynamodb/blob/v{current_version}/CHANGES.rst"'

[tool.tbump.git]
message_template = "Release {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "3.0.1"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGES.rst"
issue_format = "`#{issue} <https://github.com/dbfixtures/pytest-dynamodb/issues/{issue}>`_"
single_file = true

[[tool.towncrier.type]]
directory = "break"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "depr"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneus"
showcontent = true
